services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env.cloud
    environment:
      HOST: 0.0.0.0
      PORT: 8877
    ports:
      - "127.0.0.1:8877:8877"
    volumes:
      - learning-data:/app/.local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  web:
    profiles: [public]
    image: caddy:2-alpine
    env_file: .env.cloud
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  learning-data:
  caddy-data:
  caddy-config:
